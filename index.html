<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UgoSketch</title>
  <link rel="icon" href="./assets/ugosketch.gif">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <img class="logo" src="./assets/ugosketch.gif" alt="UgoSketch">
      <p class="tagline">画像を手描き風に揺らしてスプライトシートに</p>
      <nav class="tool-nav">
        <a class="tool-link active" href="./index.html">UgoSketch</a>
        <a class="tool-link" href="./kirisketch.html">KiriSketch</a>
      </nav>
    </header>

    <main class="layout">
      <!-- ================= PREVIEW ================= -->
      <section class="card preview">
        <div class="stage" id="stage">
          <canvas id="previewCanvas" width="1" height="1"></canvas>
          <div class="dropzone" id="dropzone">
            <div class="dz-inner">
              <div class="dz-icon">✎</div>
              <p class="dz-main">画像をドロップ / クリックで選択</p>
              <p class="dz-sub">PNG / JPG / GIF / WebP</p>
            </div>
          </div>
          <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
        </div>

        <div class="playbar">
          <button class="pb-btn" id="playToggle" title="再生 / 停止">⏸</button>
          <span class="frame-count" id="frameCount">–/–</span>
          <button class="pb-btn" id="changeImage" title="別の画像に差し替え">画像を変更</button>
          <span class="spacer"></span>
          <div class="bg-group" id="bgGroup">
            <span class="bg-label">背景</span>
            <button class="pb-btn bg active" data-bg="checker">市松</button>
            <button class="pb-btn bg" data-bg="white">白</button>
            <button class="pb-btn bg" data-bg="black">黒</button>
            <input type="color" id="bgColor" class="bg-color" value="#8888aa" title="カスタム色">
          </div>
          <div class="zoom-group" id="zoomGroup">
            <button class="pb-btn zoom active" data-zoom="fit">フィット</button>
            <button class="pb-btn zoom" data-zoom="1">1x</button>
            <button class="pb-btn zoom" data-zoom="2">2x</button>
            <button class="pb-btn zoom" data-zoom="4">4x</button>
          </div>
          <button class="pb-btn" id="compareBtn" title="押している間だけ元画像を表示">元画像と比較</button>
        </div>
      </section>

      <!-- ================= CONTROLS ================= -->
      <div class="panel">
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" hidden>

        <!-- Presets -->
        <section class="card group">
          <h2 class="group-title">プリセット</h2>
          <div class="preset-row" id="presetRow"></div>
          <div class="config-row">
            <button class="pb-btn" id="saveConfig" title="現在のパラメーターをこのブラウザに保存">設定を保存</button>
            <button class="pb-btn" id="resetConfig" title="すべてのパラメーターを初期値に戻す">初期値に戻す</button>
            <span class="config-status" id="configStatus"></span>
          </div>
        </section>

        <!-- Mode -->
        <section class="card group">
          <h2 class="group-title">モード</h2>
          <div class="tabs" id="modeTabs">
            <button class="tab active" data-mode="warp">ゆらぎ (Warp)</button>
            <button class="tab" data-mode="sdf">輪郭SDF (実験的)</button>
          </div>
          <p class="warn" id="sdfWarn" hidden>⚠ 大きい画像では生成に時間がかかります</p>
        </section>

        <!-- Shake (shared) -->
        <section class="card group">
          <h2 class="group-title">揺れ</h2>

          <div class="grid">
            <label class="row col span2">
              <span class="row-label">フィールド</span>
              <select data-param="fieldType" id="fieldSelect"></select>
            </label>
            <p class="hint span2" id="fieldHint"></p>

            <label class="row">
              <span class="row-label">強さ</span>
              <input type="range" data-param="amount" min="0" max="4" step="0.05">
              <span class="row-val" data-for="amount"></span>
            </label>
            <label class="row">
              <span class="row-label">密度</span>
              <input type="range" data-param="density" min="0" max="1" step="0.01">
              <span class="row-val" data-for="density"></span>
            </label>
            <label class="row">
              <span class="row-label">ジッター</span>
              <input type="range" data-param="jitter" min="0" max="1" step="0.01">
              <span class="row-val" data-for="jitter"></span>
            </label>
            <label class="row">
              <span class="row-label">オクターブ</span>
              <input type="range" data-param="octaves" min="1" max="4" step="1">
              <span class="row-val" data-for="octaves"></span>
            </label>
            <p class="hint span2">0 = ぬるぬる　1 = 線ブレ</p>
            <label class="row span2">
              <span class="row-label">シード</span>
              <input type="number" data-param="seed" min="0" step="1" class="num">
              <button class="mini-btn" id="seedRandom" title="ランダム">🎲</button>
            </label>
          </div>
        </section>

        <!-- Animation -->
        <section class="card group">
          <h2 class="group-title">アニメ</h2>
          <div class="grid">
            <label class="row">
              <span class="row-label">フレーム数</span>
              <input type="range" data-param="frameCount" min="2" max="12" step="1">
              <span class="row-val" data-for="frameCount"></span>
            </label>
            <label class="row">
              <span class="row-label">FPS</span>
              <input type="range" data-param="fps" min="1" max="30" step="1">
              <span class="row-val" data-for="fps"></span>
            </label>
            <label class="row check span2">
              <input type="checkbox" data-param="pingPong">
              <span>ピンポン再生 (往復ループ)</span>
            </label>
          </div>
        </section>

        <!-- Size -->
        <section class="card group">
          <h2 class="group-title">サイズ</h2>
          <div class="grid">
            <label class="row">
              <span class="row-label">スケール</span>
              <input type="range" data-param="scale" min="0.25" max="2" step="0.05">
              <span class="row-val" data-for="scale"></span>
            </label>
            <label class="row">
              <span class="row-label">余白</span>
              <input type="range" data-param="padding" min="0" max="32" step="1">
              <span class="row-val" data-for="padding"></span>
            </label>
            <p class="hint span2">出力サイズ: <span id="outSize">–</span></p>
            <label class="row col span2">
              <span class="row-label">サンプリング</span>
              <select data-param="sampling" id="samplingSelect">
                <option value="bilinear">バイリニア</option>
                <option value="nearest">ニアレスト (ドット絵用)</option>
              </select>
            </label>
            <label class="row check span2">
              <input type="checkbox" data-param="pixelPerfect" id="pixelPerfect">
              <span>ピクセルパーフェクト</span>
            </label>
            <label class="row span2">
              <span class="row-label">1ドットのpx数</span>
              <input type="number" data-param="pixelGrid" id="pixelGrid" min="1" max="32" step="1" class="num">
            </label>
            <p class="hint span2">ドット絵向け。揺れをドット単位にスナップし、エッジをくっきり保つ。拡大済みドット絵は1ドットが何pxかを指定</p>
          </div>
        </section>

        <!-- Quantize (warp only) -->
        <section class="card group" id="quantGroup">
          <h2 class="group-title">減色</h2>
          <div class="grid">
            <label class="row check span2">
              <input type="checkbox" data-param="alphaCrisp" id="alphaCrisp">
              <span>アルファくっきり</span>
            </label>
            <label class="row span2">
              <span class="row-label">アルファしきい値</span>
              <input type="range" data-param="alphaThreshold" id="alphaCrispThreshold" min="0" max="255" step="1">
              <span class="row-val" data-for="alphaThreshold"></span>
            </label>
            <label class="row check span2">
              <input type="checkbox" data-param="quantEnabled">
              <span>減色を有効にする</span>
            </label>
            <label class="row">
              <span class="row-label">色数</span>
              <input type="range" data-param="quantColors" min="2" max="64" step="1">
              <span class="row-val" data-for="quantColors"></span>
            </label>
            <label class="row col">
              <span class="row-label">ディザ</span>
              <select data-param="dither">
                <option value="none">なし</option>
                <option value="bayer4">Bayer 4×4</option>
                <option value="bayer8">Bayer 8×8</option>
                <option value="floyd">Floyd–Steinberg</option>
              </select>
            </label>
            <label class="row span2">
              <span class="row-label">ディザ強度</span>
              <input type="range" data-param="ditherStrength" min="0" max="1" step="0.01">
              <span class="row-val" data-for="ditherStrength"></span>
            </label>
            <div class="swatches span2" id="quantPalette"></div>
          </div>
        </section>

        <!-- SDF (sdf only) -->
        <section class="card group" id="sdfGroup" hidden>
          <h2 class="group-title">SDF</h2>
          <div class="grid">
            <label class="row">
              <span class="row-label">領域色数</span>
              <input type="range" data-param="sdfColors" min="2" max="16" step="1">
              <span class="row-val" data-for="sdfColors"></span>
            </label>
            <label class="row">
              <span class="row-label">線の太さ</span>
              <input type="range" data-param="sdfWeight" min="-8" max="8" step="0.5">
              <span class="row-val" data-for="sdfWeight"></span>
            </label>
            <label class="row">
              <span class="row-label">エッジのソフトさ</span>
              <input type="range" data-param="sdfSoftness" min="0.5" max="4" step="0.1">
              <span class="row-val" data-for="sdfSoftness"></span>
            </label>
            <label class="row">
              <span class="row-label">輪郭幅</span>
              <input type="range" data-param="sdfOutlineWidth" min="1" max="10" step="1">
              <span class="row-val" data-for="sdfOutlineWidth"></span>
            </label>
            <label class="row check span2">
              <input type="checkbox" data-param="sdfOutline">
              <span>輪郭のみ抽出</span>
            </label>
            <label class="row">
              <span class="row-label">バラけ具合</span>
              <input type="range" data-param="sdfDecorrelation" min="0" max="1" step="0.01">
              <span class="row-val" data-for="sdfDecorrelation"></span>
            </label>
            <label class="row">
              <span class="row-label">アルファしきい値</span>
              <input type="range" data-param="alphaThreshold" min="0" max="255" step="1">
              <span class="row-val" data-for="alphaThreshold"></span>
            </label>
            <div class="swatches span2" id="sdfPalette"></div>
          </div>
        </section>

        <!-- Export -->
        <section class="card group export">
          <h2 class="group-title">書き出し</h2>
          <div class="grid">
            <label class="row">
              <span class="row-label">列数</span>
              <input type="number" id="sheetCols" min="1" step="1" class="num">
            </label>
            <label class="row">
              <span class="row-label">目標サイズ</span>
              <input type="number" id="snsTarget" min="1" step="1" value="1024" class="num">
              <span class="row-unit">px以上</span>
            </label>
            <label class="row check span2">
              <input type="checkbox" id="sheetMeta" checked>
              <span>メタJSONも保存</span>
            </label>
            <label class="row check span2">
              <input type="checkbox" id="snsUpscale">
              <span>SNS用に拡大する</span>
            </label>
            <p class="hint span2" id="snsInfo" hidden></p>
          </div>
          <button class="export-btn primary" id="exportSheet">シートPNG保存</button>
          <div class="export-grid">
            <button class="export-btn" id="copySheet">クリップボードにコピー</button>
            <button class="export-btn" id="exportSeq">連番PNG (ZIP)</button>
            <button class="export-btn" id="exportGif">GIF</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="app-footer">
      すべてブラウザ内で処理され、画像はアップロードされません。
    </footer>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
